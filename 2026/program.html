  <section class="page-hero">
    <div class="container">
      <div class="section-tag" data-aos="fade-up">11/09/2026</div>

  <main id="main">
    <section class="program-section">
      <div class="container">

        <div class="program-meta" data-aos="fade-up">
          <div class="pm-item">
            <i class="bi bi-calendar-event"></i>
            <span><strong>11 de setembro de 2026</strong> · sexta-feira</span>
          </div>
          <div class="pm-item">
            <i class="bi bi-geo-alt"></i>
            <span>Sala <strong>Margaret Hamilton</strong></span>
          </div>
          <div class="pm-item">
            <i class="bi bi-clock-history"></i>
            <span><strong>14h00</strong> às <strong>17h50</strong></span>
          </div>
        </div>

        <div class="program-wrap" data-aos="fade-up">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <td style="width:170px;">Horário</td>
                  <th scope="col" colspan="5">Atividade</th>
                </tr>
              </thead>
              <tbody id="program-body">
                <!-- preenchido via JS -->
              </tbody>
            </table>
          </div>
        </div>

        <div id="program-fallback" class="coming-soon mt-4" style="display:none;">
          <div class="cs-icon"><i class="bi bi-calendar3"></i></div>
          <h2>Em breve</h2>
          <p>A programação completa será divulgada em breve.</p>
        </div>

      </div>
    </section>
  </main>

  <script>
    (function() {
      if (location.protocol === 'file:') return;
      var x = new XMLHttpRequest();
      x.open('GET', 'partials/footer.html', false);
      x.send(null);
      if (x.status === 200) document.write(x.responseText);
    })();
  </script>

  <a href="#" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>
  <div id="preloader"></div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <script>
    const program = [
      {
        time: "14h00",
        type: "opening",
        title: "Abertura"
      },
      {
        time: "14h10 – 15h00",
        type: "keynote",
        title: "O papel dos bots na avaliação e no desenvolvimento de software acessível",
        speaker: "Marcelo Medeiros Eler",
        affiliation: "EACH – USP",
        abstract: "A acessibilidade digital é uma característica essencial de aplicações interativas, permitindo que pessoas com diferentes habilidades utilizem sistemas, serviços e informações digitais de forma autônoma e segura. Apesar da existência de legislação, padrões e diretrizes consolidadas, incorporar acessibilidade ao processo de desenvolvimento de software ainda é um desafio: muitos problemas são identificados apenas nas etapas finais do ciclo de vida, enquanto as ferramentas automatizadas tradicionais conseguem detectar apenas parte das barreiras enfrentadas pelas pessoas com deficiência. Esta palestra apresenta como a automação de atividades de desenvolvimento pode apoiar a acessibilidade ao longo do ciclo de vida de um software, incluindo conceitos fundamentais de acessibilidade, iniciativas consolidadas de automação da avaliação de aplicações interativas e avanços recentes no uso de agentes inteligentes e Grandes Modelos de Linguagem (LLMs), tanto na avaliação quanto no desenvolvimento de aplicações, inclusive por pessoas com deficiência que atuam diretamente na construção de software."
      },
      {
        time: "15h15 – 15h30",
        type: "discussion",
        title: "Discussão"
      },
      {
        time: "15h30 – 16h00",
        type: "award",
        title: "Premiação de artigos e de revisores"
      },
      {
        time: "16h00 – 16h30",
        type: "coffee",
        title: "Coffee break"
      },
      {
        time: "16h30 – 16h45",
        type: "paper",
        title: "Pre-Deployment Evaluation of LLM-based Conversational Agents through a Digital Twin-Inspired Approach",
        authors: [
          "Caio Vinicius Bernardo (USP, Brasil)",
          "Thais Rodrigues Neubauer (USP, Brasil)",
          "Gregorio Assagra de Almeida Filho",
          "Enio Alterman Blay",
          "Sarajane Marques Peres (USP, Brasil)"
        ]
      },
      {
        time: "16h45 – 16h50",
        type: "discussion",
        title: "Discussão"
      },
      {
        time: "16h50 – 17h05",
        type: "paper",
        title: "Uma Proposta de Arquitetura de Software para uma Plataforma Conversacional de Suporte à BNCC",
        authors: [
          "Emanuel Coutinho (UFC, Brasil)",
          "Francisco Gilvan de Oliveira (UFC, Brasil)"
        ]
      },
      {
        time: "17h05 – 17h10",
        type: "discussion",
        title: "Discussão"
      },
      {
        time: "17h10 – 17h25",
        type: "paper",
        title: "ArcAssist-Web Bot: A Prototype Instantiation for Evidence-Grounded Architectural Decision Support",
        authors: [
          "Vanusa Rodrigues de Oliveira (UFLA, Brasil)",
          "Bento Rafael Siqueira (UFLA, Brasil)",
          "Samira Santos da Silva (UFLA, Brasil)"
        ]
      },
      {
        time: "17h25 – 17h30",
        type: "discussion",
        title: "Discussão"
      },
      {
        time: "17h30 – 17h45",
        type: "paper",
        title: "Uma Ferramenta para Apoiar a Seleção de Instrumentos de Avaliação de Chatbots Educacionais",
        authors: [
          "Mariana Almeida (UTFPR, Brasil)",
          "Gabriel Felipe Jess Meira (PUCPR, Brasil)",
          "Silvana Morita Melo (UFGD, Brasil)",
          "Leo Natan Paschoal (PUCPR, Brasil)",
          "Pedro Henrique Dias Valle (USP, Brasil)"
        ]
      },
      {
        time: "17h45 – 17h50",
        type: "discussion",
        title: "Discussão"
      },
      {
        time: "17h50",
        type: "closing",
        title: "Encerramento"
      }
    ];

    const SIMPLE_ROWS = {
      opening: "bi-megaphone",
      closing: "bi-flag",
      coffee:  "bi-cup-hot",
      award:   "bi-trophy"
    };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function renderProgram(data) {
      const tbody = document.getElementById("program-body");
      const fallback = document.getElementById("program-fallback");
      tbody.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        fallback.style.display = "flex";
        return;
      }
      fallback.style.display = "none";

      data.forEach((item, idx) => {
        const type = (item.type || "").toLowerCase();
        const cid = `det-${idx}`;
        const tr = document.createElement("tr");

        const tdTime = document.createElement("td");
        tdTime.className = "time-cell";
        tdTime.innerHTML = `<i class="bi bi-clock me-2"></i>${esc(item.time)}`;

        const tdInfo = document.createElement("td");
        tdInfo.colSpan = 5;

        if (SIMPLE_ROWS[type]) {
          tr.className = "prog-row-highlight";
          tdInfo.innerHTML = `<i class="bi ${SIMPLE_ROWS[type]}"></i>${esc(item.title)}`;

        } else if (type === "discussion") {
          tr.className = "prog-row-muted";
          tdInfo.innerHTML = `<i class="bi bi-chat-dots me-2"></i>${esc(item.title)}`;

        } else if (type === "keynote") {
          tdInfo.innerHTML = `
            <span class="prog-kind">Palestra</span>
            <div class="prog-title">${esc(item.title)}</div>
            <div class="prog-speaker">${esc(item.speaker)} <span>· ${esc(item.affiliation)}</span></div>
            <button class="prog-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${cid}"
                    aria-expanded="false" aria-controls="${cid}" aria-label="Ver resumo da palestra">
              <span class="pt-dot"></span>
              <span class="pt-label" data-closed="Ver resumo" data-open="Ocultar resumo"></span>
              <i class="bi bi-chevron-right"></i>
            </button>
            <div id="${cid}" class="collapse">
              <div class="prog-detail"><p>${esc(item.abstract)}</p></div>
            </div>`;

        } else {
          const authors = Array.isArray(item.authors) ? item.authors : [];
          tdInfo.innerHTML = `
            <span class="prog-kind">Apresentação</span>
            <div class="prog-title">${esc(item.title)}</div>
            ${authors.length ? `
            <button class="prog-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${cid}"
                    aria-expanded="false" aria-controls="${cid}" aria-label="Ver autores do trabalho">
              <span class="pt-dot"></span>
              <span class="pt-label" data-closed="Ver autores" data-open="Ocultar autores"></span>
              <i class="bi bi-chevron-right"></i>
            </button>
            <div id="${cid}" class="collapse">
              <div class="prog-detail">
                <p class="prog-authors"><strong>Autores:</strong> ${authors.map(esc).join(", ")}</p>
              </div>
            </div>` : ""}`;
        }

        tr.appendChild(tdTime);
        tr.appendChild(tdInfo);
        tbody.appendChild(tr);
      });
    }

    document.addEventListener("DOMContentLoaded", () => renderProgram(program));
  </script>

  <script src="assets/js/main.js"></script>
</body>
</html>
